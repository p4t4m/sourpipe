name: iOS
# macOS runners cost ten times the free minutes of Linux ones, so this runs only for main, pull
# requests and by hand (Actions > iOS > Run workflow), and not for documentation-only changes.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "screenshots/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "screenshots/**", "LICENSE"]
  workflow_dispatch:

jobs:
  simulator-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test the platform-neutral core
        working-directory: ios
        run: swift test
      - name: Build for the simulator
        working-directory: ios
        run: |
          xcodebuild -project SourPipe.xcodeproj -scheme SourPipe -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Launch in a simulator and take a screenshot
        working-directory: ios
        run: |
          device="$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          for runtime, devices in json.load(sys.stdin)['devices'].items():
              if 'iOS' in runtime:
                  for d in devices:
                      if d['name'].startswith('iPhone'):
                          print(d['udid']); raise SystemExit")"
          xcrun simctl boot "$device"
          xcrun simctl install "$device" build/Build/Products/Debug-iphonesimulator/SourPipe.app
          xcrun simctl launch "$device" app.sourpipe.SourPipe
          # Long enough for the extractor to start and the first list to load over the network.
          sleep 45
          xcrun simctl io "$device" screenshot home.png
          # launch only reports start-up; a crash since then leaves the app absent from this list.
          xcrun simctl spawn "$device" launchctl list | grep -q app.sourpipe.SourPipe
      - name: Open a video and capture playback
        if: always()
        working-directory: ios
        run: |
          device="$(xcrun simctl list devices booted -j | python3 -c "
          import json,sys
          for devices in json.load(sys.stdin)['devices'].values():
              for d in devices:
                  print(d['udid']); raise SystemExit")"
          # YouTube refuses data-center addresses, so CI plays from services that do not.
          capture() {
            name="$1"; link="$2"; shift 2
            xcrun simctl terminate "$device" app.sourpipe.SourPipe || true
            xcrun simctl launch "$device" app.sourpipe.SourPipe -openLink "$link" "$@"
            sleep 35
            xcrun simctl io "$device" screenshot "$name-1.png"
            sleep 12
            xcrun simctl io "$device" screenshot "$name-2.png"
          }
          ccc="$(curl -fsS https://api.media.ccc.de/public/events/recent | python3 -c "
          import json,sys
          print(json.load(sys.stdin)['events'][0]['frontend_link'])")"
          peertube="$(curl -fsS 'https://framatube.org/api/v1/videos?count=1&sort=-publishedAt&isLocal=true' | python3 -c "
          import json,sys
          print(json.load(sys.stdin)['data'][0]['url'])")"
          echo "Testing $ccc and $peertube"
          capture mediaccc "$ccc" -testDislikeVideoID aqz-KE-bpKQ
          capture peertube "$peertube"
          # Full screen must turn landscape although the simulator is held upright.
          xcrun simctl terminate "$device" app.sourpipe.SourPipe || true
          xcrun simctl launch "$device" app.sourpipe.SourPipe -openLink "$peertube" -testFullscreen YES
          sleep 30
          xcrun simctl io "$device" screenshot fullscreen.png
          # A download, fetched in ranges.
          xcrun simctl terminate "$device" app.sourpipe.SourPipe || true
          xcrun simctl launch "$device" app.sourpipe.SourPipe -testDownload "$ccc"
          sleep 60
          xcrun simctl io "$device" screenshot download.png
          # The saved file's page: no spinner, no fetching, a "Playing from download" notice.
          xcrun simctl terminate "$device" app.sourpipe.SourPipe || true
          xcrun simctl launch "$device" app.sourpipe.SourPipe -testPlayDownload YES
          sleep 15
          xcrun simctl io "$device" screenshot download-playing.png
          # Home with several sections: the tab row is the list's first row.
          xcrun simctl terminate "$device" app.sourpipe.SourPipe || true
          xcrun simctl launch "$device" app.sourpipe.SourPipe -testHomeTabs YES
          sleep 20
          xcrun simctl io "$device" screenshot home-tabs.png
          # The CAPTCHA banner, then the challenge page opened in the web view.
          sorry='https://www.google.com/sorry/index?continue=https://www.youtube.com/'
          xcrun simctl terminate "$device" app.sourpipe.SourPipe || true
          xcrun simctl launch "$device" app.sourpipe.SourPipe -testCaptcha "$sorry"
          sleep 20
          xcrun simctl io "$device" screenshot captcha-banner.png
          xcrun simctl terminate "$device" app.sourpipe.SourPipe || true
          xcrun simctl launch "$device" app.sourpipe.SourPipe -testCaptcha "$sorry" -testCaptchaOpen YES
          sleep 25
          xcrun simctl io "$device" screenshot captcha-sheet.png
          # Skipping while backgrounded, which also starts Picture in Picture where available.
          xcrun simctl terminate "$device" app.sourpipe.SourPipe || true
          xcrun simctl launch "$device" app.sourpipe.SourPipe -openLink "$peertube" -testSkipAfter 25
          sleep 15
          xcrun simctl launch "$device" com.apple.Preferences
          sleep 60
          xcrun simctl io "$device" screenshot background.png
          xcrun simctl spawn "$device" log show --last 12m --style compact \
            --predicate 'eventMessage CONTAINS "[player]" OR eventMessage CONTAINS "[extractor]" OR eventMessage CONTAINS "[dislikes]" OR eventMessage CONTAINS "[captcha]" OR eventMessage CONTAINS "[download]"' > player.log || true
          cat player.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshot
          path: |
            ios/*.png
            ios/player.log
          if-no-files-found: warn

  device-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build an unsigned IPA for sideloading
        working-directory: ios
        run: |
          xcodebuild -project SourPipe.xcodeproj -scheme SourPipe -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/SourPipe.app Payload/
          zip -qry SourPipe-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SourPipe-unsigned-ipa
          path: ios/SourPipe-unsigned.ipa
          if-no-files-found: error
